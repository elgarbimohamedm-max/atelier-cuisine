<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo minimaliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2A2522}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #FAF6F1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif; color: #2A2522">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0">
<div style="font-size: 44px; font-weight: 300; line-height: 1">l’atelier</div>
<div style="font-size: 92px; font-weight: 600; letter-spacing: -3px; line-height: 1">cuisine<span style="color: {{accent}}">.</span></div>
<div style="width: 100%; height: 10px; background: {{accent}}; border-radius: 2px; margin-top: 10px"></div>
<div style="display: flex; justify-content: space-between; width: 100%">
<div style="width: 10px; height: 26px; background: #2A2522; margin-left: 24px"></div>
<div style="width: 10px; height: 26px; background: #2A2522; margin-right: 24px"></div>
</div>
</div>
<div style="font-size: 15px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; color: #5A514B">Conception · Pose · Montage de meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8643B","options":["#C8643B","#4F7A63","#2A2522"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C8643B' };
}
}
</script>
</body>
</html>
