<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo Agencement &amp; Pose</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#E8E8E8}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #1C1C1C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #FFFFFF">
<svg width="150" height="130" viewBox="0 0 130 112" fill="none" role="img" aria-label="Modules de meubles assemblés">
<rect x="6" y="6" width="36" height="100" rx="3" stroke="#FFFFFF" stroke-width="5"></rect>
<rect x="48" y="6" width="36" height="46" rx="3" stroke="#FFFFFF" stroke-width="5"></rect>
<rect x="48" y="58" width="36" height="48" rx="3" fill="{{accent}}"></rect>
<rect x="90" y="6" width="34" height="100" rx="3" stroke="#FFFFFF" stroke-width="5"></rect>
<line x1="36" y1="50" x2="36" y2="62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></line>
<line x1="96" y1="50" x2="96" y2="62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></line>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 50px; font-weight: 800; letter-spacing: 1px; line-height: 1">AGENCEMENT</div>
<div style="display: flex; align-items: center; gap: 16px">
<div style="width: 48px; height: 2px; background: {{accent}}"></div>
<div style="font-size: 26px; font-weight: 400; letter-spacing: 8px; line-height: 1; color: {{accent}}">&amp; POSE</div>
<div style="width: 48px; height: 2px; background: {{accent}}"></div>
</div>
</div>
<div style="font-size: 15px; font-weight: 400; letter-spacing: 2px; color: #C8C8C8">Cuisines · Dressings · Meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A15B","options":["#C9A15B","#E07A3E","#7FB7A4"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C9A15B' };
}
}
</script>
</body>
</html>
