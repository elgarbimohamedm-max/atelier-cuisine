<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo maison</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1D4E52}a:hover{color:#0F3134}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; color: #1D4E52">
<svg width="160" height="150" viewBox="0 0 128 120" fill="none" role="img" aria-label="Maison avec un meuble de cuisine">
<path d="M10 54 L64 10 L118 54" stroke="#1D4E52" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M22 46 V112 H106 V46" stroke="#1D4E52" stroke-width="7" stroke-linejoin="round"></path>
<line x1="34" y1="70" x2="94" y2="70" stroke="{{accent}}" stroke-width="6" stroke-linecap="round"></line>
<rect x="40" y="76" width="48" height="28" rx="3" stroke="{{accent}}" stroke-width="5"></rect>
<line x1="64" y1="76" x2="64" y2="104" stroke="{{accent}}" stroke-width="5"></line>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 30px; font-weight: 600; line-height: 1.1">L’Atelier</div>
<div style="font-size: 70px; font-weight: 800; letter-spacing: -1px; line-height: 1">Cuisine</div>
</div>
<div style="font-size: 16px; font-weight: 600; letter-spacing: 1px; color: #3D6B6F">Conception · Pose · Montage de meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E39B2D","options":["#E39B2D","#D9661F","#3A9188"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E39B2D' };
}
}
</script>
</body>
</html>
