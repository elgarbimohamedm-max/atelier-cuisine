<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo plan anthracite et bois</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2E3338}a:hover{color:#2E3338}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #F5F1EA; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; font-family: 'Space Grotesk', Arial, sans-serif; color: #2E3338">
<svg width="170" height="150" viewBox="0 0 140 124" fill="none" role="img" aria-label="Plan de cuisine vu du dessus">
<path d="M10 10 H130 V40 H40 V114 H10 Z" stroke="#2E3338" stroke-width="4" stroke-linejoin="round"></path>
<line x1="40" y1="10" x2="40" y2="40" stroke="#2E3338" stroke-width="2"></line>
<line x1="70" y1="10" x2="70" y2="40" stroke="#2E3338" stroke-width="2"></line>
<line x1="100" y1="10" x2="100" y2="40" stroke="#2E3338" stroke-width="2"></line>
<line x1="10" y1="70" x2="40" y2="70" stroke="#2E3338" stroke-width="2"></line>
<circle cx="55" cy="25" r="5" stroke="{{accent}}" stroke-width="3"></circle>
<circle cx="85" cy="25" r="5" stroke="{{accent}}" stroke-width="3"></circle>
<rect x="66" y="66" width="56" height="30" rx="2" stroke="{{accent}}" stroke-width="4"></rect>
<line x1="10" y1="120" x2="130" y2="120" stroke="#2E3338" stroke-width="1.5" stroke-dasharray="4 4"></line>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 24px; font-weight: 400; letter-spacing: 8px; text-transform: uppercase; line-height: 1">L’Atelier</div>
<div style="font-size: 64px; font-weight: 700; letter-spacing: -1px; line-height: 1">CUISINE</div>
</div>
<div style="font-size: 15px; letter-spacing: 2px; color: #5A5F64">Conception · Pose · Montage de meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B07A4A","options":["#B07A4A","#8C6A4F","#2E3338"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#B07A4A' };
}
}
</script>
</body>
</html>
