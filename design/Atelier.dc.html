<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo L’Atelier Cuisine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&amp;family=Work+Sans:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#3B2A1E}a:hover{color:#1E140D}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #F4EFE6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: #3B2A1E">
<svg width="140" height="140" viewBox="0 0 120 120" fill="none" role="img" aria-label="Hotte et plan de travail stylisés">
<path d="M46 14 H74 V40 L100 66 H20 L46 40 Z" stroke="#3B2A1E" stroke-width="5" stroke-linejoin="round"></path>
<line x1="8" y1="84" x2="112" y2="84" stroke="{{accent}}" stroke-width="7" stroke-linecap="round"></line>
<line x1="26" y1="84" x2="26" y2="108" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"></line>
<line x1="94" y1="84" x2="94" y2="108" stroke="#3B2A1E" stroke-width="5" stroke-linecap="round"></line>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 400; font-style: italic; line-height: 1">L’Atelier</div>
<div style="font-family: 'Fraunces', Georgia, serif; font-size: 66px; font-weight: 700; line-height: 1.05">Cuisine</div>
</div>
<div style="font-family: 'Work Sans', Arial, sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #6B4E36">Conception · Pose · Montage</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A0673A","options":["#A0673A","#5E7D4F","#B5452F"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#A0673A' };
}
}
</script>
</body>
</html>
