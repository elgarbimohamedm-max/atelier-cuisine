<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo carreaux</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Archivo:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; color: #111111">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 360px">
<div style="background: #111111; color: #FFFFFF; height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', Arial, sans-serif; font-size: 34px; letter-spacing: 1px">L’ATE</div>
<div style="background: {{accent}}; color: #111111; height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', Arial, sans-serif; font-size: 34px; letter-spacing: 1px">LIER</div>
<div style="background: {{accent}}; color: #111111; height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', Arial, sans-serif; font-size: 34px; letter-spacing: 1px">CUISI</div>
<div style="background: #111111; color: #FFFFFF; height: 120px; display: flex; align-items: center; justify-content: center; font-family: 'Archivo Black', Arial, sans-serif; font-size: 34px; letter-spacing: 1px">NE</div>
</div>
<div style="font-family: 'Archivo', Arial, sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: #333333">Conception · Pose · Montage de meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8B931","options":["#E8B931","#7FB7A4","#E9A08A"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#E8B931' };
}
}
</script>
</body>
</html>
