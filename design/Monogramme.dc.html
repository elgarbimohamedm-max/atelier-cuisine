<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logo monogramme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&amp;family=Jost:wght@400&amp;display=swap">
<style>
body{margin:0}
a{color:#C9A15B}a:hover{color:#E0BC7A}
</style>
</helmet>
<div style="width: 600px; height: 600px; box-sizing: border-box; padding: 56px; background: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #F2ECE0">
<div style="width: 170px; height: 170px; border-radius: 999px; border: 3px solid {{accent}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 84px; font-weight: 700; letter-spacing: -4px; color: {{accent}}; line-height: 1">AC</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 48px; font-weight: 500; letter-spacing: 3px; line-height: 1">L’Atelier Cuisine</div>
</div>
<div style="font-family: 'Jost', Arial, sans-serif; font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #BDB6A8">Conception · Pose · Montage de meubles</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A15B","options":["#C9A15B","#D4D4D4","#C77D57"]},"$preview":{"width":600,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C9A15B' };
}
}
</script>
</body>
</html>
